server:
  port: ${GATEWAY_PORT:8080}

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    hostname: localhost
    prefer-ip-address: false

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: ms-vehicle
          uri: lb://ms-vehicle
          predicates:
            - Path=/vehicle/**
        - id: ms-repairs
          uri: lb://ms-repairs
          predicates:
            - Path=/repairs/**
        - id: ms-repair-orders
          uri: lb://ms-repair-orders
          predicates:
            - Path=/orders/**,/bonuses/**
        - id: ms-reports
          uri: lb://ms-reports
          predicates:
            - Path=/reports/**
